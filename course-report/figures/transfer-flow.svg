="#687984" stroke-width="3"/><rect x="100" y="970" width="900" height="170" fill="#eef4f8" stroke="#176ba0" stroke-width="1.5"/><text x="550" y="1010.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#18252e">5  Transaction Service</text><text x="550" y="1052.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#18252e">Запись completed в Transaction DB</text><text x="550" y="1083.98" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#18252e">Ответ клиенту через Gateway</text><text x="550" y="1235.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#18252e">При неизвестном исходе запись остается pending</text><text x="550" y="1277.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#18252e">Recovery вызывает ResolveTransfer и согласует итог журнала</text><text x="550" y="1313.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#18252e">Между двумя БД общей ACID-транзакции нет</text></svg>