name: bank-course-comparison
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "3" }
x-go: &go
  image: bank-compare-micro:local
  build:
    context: ../..
    dockerfile: load-tests/comparison/Dockerfile.micro
    args: { GO_IMAGE: "${GO_IMAGE:-golang:1.27-alpine}" }
  cpus: 1
  mem_limit: 512m
  logging: *logging
  labels: { org.bank.course.comparison: "1" }
  healthcheck: &go-health
    test: ["CMD", "/app/auth_service", "healthcheck"]
    interval: 3s
    timeout: 3s
    retries: 20
x-pg: &pg
  image: postgres:16-alpine
  cpus: 1.5
  mem_limit: 1g
  logging: *logging
  labels: { org.bank.course.comparison: "1" }
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 2s
    timeout: 3s
    retries: 30
services:
  postgres_auth:
    <<: *pg
    environment: { POSTGRES_USER: auth_user, POSTGRES_PASSWORD: auth_password, POSTGRES_DB: auth_db }
    volumes:
      - auth_pg:/var/lib/postgresql/data
      - ../../migrations/auth/000001_init_auth.up.sql:/docker-entrypoint-initdb.d/init.sql:ro
  postgres_accounts:
    <<: *pg
    environment: { POSTGRES_USER: account_user, POSTGRES_PASSWORD: account_password, POSTGRES_DB: account_db }
    volumes:
      - account_pg:/var/lib/postgresql/data
      - ../../migrations/account/000001_init_account.up.sql:/docker-entrypoint-initdb.d/init.sql:ro
  postgres_transactions:
    <<: *pg
    environment: { POSTGRES_USER: tx_user, POSTGRES_PASSWORD: tx_password, POSTGRES_DB: tx_db }
    volumes:
      - tx_pg:/var/lib/postgresql/data
      - ../../migrations/transaction/000001_init_transaction.up.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7.4-alpine
    cpus: 0.5
    mem_limit: 512m
    logging: *logging
    labels: { org.bank.course.comparison: "1" }
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    <<: *go
    command: ["/app/auth_service"]
    environment:
      LOG_LEVEL: warn
      GRPC_ADDR: ":50051"
      DEBUG_ADDR: ":6060"
      DATABASE_URL: postgres://auth_user:auth_password@postgres_auth:5432/auth_db?sslmode=disable
      DB_MAX_CONNS: "20"
      JWT_SECRET: comparison-only-jwt-secret
      BCRYPT_COST: "10"
    depends_on:
      postgres_auth: { condition: service_healthy }
  account:
    <<: *go
    command: ["/app/account_service"]
    healthcheck:
      <<: *go-health
      test: ["CMD", "/app/account_service", "healthcheck"]
    environment:
      LOG_LEVEL: warn
      GRPC_ADDR: ":50052"
      DEBUG_ADDR: ":6060"
      DATABASE_URL: postgres://account_user:account_password@postgres_accounts:5432/account_db?sslmode=disable
      DB_MAX_CONNS: "32"
      DB_LOCK_TIMEOUT: 2s
      REDIS_ADDR: redis:6379
      CACHE_TTL: 300s
      ACCOUNT_OPENING_BALANCE: "20000.00"
      FEE_SWEEP_INTERVAL: 5s
    depends_on:
      postgres_accounts: { condition: service_healthy }
      redis: { condition: service_healthy }
  transaction:
    <<: *go
    command: ["/app/transaction_service"]
    healthcheck:
      <<: *go-health
      test: ["CMD", "/app/transaction_service", "healthcheck"]
    environment:
      LOG_LEVEL: warn
      GRPC_ADDR: ":50053"
      DEBUG_ADDR: ":6060"
      DATABASE_URL: postgres://tx_user:tx_password@postgres_transactions:5432/tx_db?sslmode=disable
      DB_MAX_CONNS: "32"
      ACCOUNT_SERVICE_ADDR: account:50052
      ACCOUNT_CALL_TIMEOUT: 3s
      RECOVERY_INTERVAL: 5s
      RECOVERY_AGE: 30s
      WORKER_COUNT: "100"
      WORKER_QUEUE_SIZE: "1000"
    depends_on:
      postgres_transactions: { condition: service_healthy }
      account: { condition: service_healthy }
  gateway:
    <<: *go
    command: ["/app/api-gateway"]
    healthcheck:
      <<: *go-health
      test: ["CMD", "/app/api-gateway", "healthcheck"]
    ports: ["127.0.0.1:18080:8080"]
    environment:
      LOG_LEVEL: warn
      PORT: "8080"
      DEBUG_ADDR: ":6060"
      JWT_SECRET: comparison-only-jwt-secret
      AUTH_SERVICE_ADDR: auth:50051
      ACCOUNT_SERVICE_ADDR: account:50052
      TRANSACTION_SERVICE_ADDR: transaction:50053
      REQUEST_TIMEOUT: 5s
    depends_on:
      auth: { condition: service_healthy }
      account: { condition: service_healthy }
      transaction: { condition: service_healthy }
volumes:
  auth_pg:
    labels: { org.bank.course.comparison: "1" }
  account_pg:
    labels: { org.bank.course.comparison: "1" }
  tx_pg:
    labels: { org.bank.course.comparison: "1" }
