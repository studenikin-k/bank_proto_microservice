# nginx — единая точка входа и балансировщик перед репликами API Gateway.
# Реплики находятся через DNS docker-compose (общий алиас gateway-pool): при
# `GATEWAY_EXTRA_REPLICAS=3 docker compose up` nginx сам увидит все четыре реплики.

worker_processes auto;

events {
    worker_connections 8192;
}

http {
    # $upstream_addr показывает, какая реплика обработала запрос;
    # $upstream_response_time — сколько ответ шёл от шлюза (без собственного времени nginx).
    log_format upstream '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                        'rt=$request_time urt=$upstream_response_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream buffer=64k flush=5s;

    # DNS docker-compose: адреса реплик перечитываются каждые 5 секунд.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api_gateway_cluster {
        zone api_gateway_cluster 64k;
        least_conn;  # запрос уходит реплике с наименьшим числом активных соединений

        # Пассивная проверка: после 3 ошибок подряд реплика исключается на 10 секунд.
        server gateway-pool:8080 resolve max_fails=3 fail_timeout=10s;

        # Кеш простаивающих соединений к репликам на каждый worker. Это не лимит
        # параллельности: при нехватке nginx открывает новые соединения.
        keepalive 128;
        keepalive_timeout 60s; # меньше IdleTimeout шлюза (90s)
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 1m;

        location / {
            proxy_pass http://api_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s; # больше REQUEST_TIMEOUT шлюза (5s)

            # Если реплика недоступна, запрос уходит на другую. POST повторяется, только
            # если он ещё не был отправлен упавшей реплике (nginx не повторяет
            # неидемпотентные запросы) — повтор перевода остаётся за клиентом
            # с тем же Idempotency-Key. Ответ 503 от шлюза не повторяется: он означает
            # проблему общего для всех реплик сервиса, и повтор только добавил бы нагрузки.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }
    }
}
