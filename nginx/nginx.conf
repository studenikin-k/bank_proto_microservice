# Пул из 4 независимых процессов API Gateway
upstream api_gateway_cluster {
    least_conn; # Направлять запрос на менее загруженный инстанс

    server host.docker.internal:8080 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8081 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8082 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8083 max_fails=3 fail_timeout=10s;

    # Держим до 512 постоянно открытых сокетов к шлюзам
    keepalive 512;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://api_gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Буферизация для сглаживания пиков
        proxy_buffering on;
        proxy_buffers 32 16k;
        proxy_buffer_size 16k;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}