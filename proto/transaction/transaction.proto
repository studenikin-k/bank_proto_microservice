syntax = "proto3";

package transaction;

option go_package = "bank_proto_microservice/proto/transaction;transactionpb";

// Все денежные суммы передаются как int64 в копейках.
service TransactionService {
  // Синхронный перевод или платёж. Сага: запись pending -> AccountService.ApplyTransfer
  // -> completed / failed. При неизвестном исходе запись остаётся pending,
  // её доводит до конца recovery-воркер.
  rpc CreateTransaction(CreateTransactionRequest) returns (TransactionResponse);

  // Асинхронный вариант: запись создаётся в статусе pending и сразу возвращается,
  // исполняет её Worker Pool. Итог можно узнать через GetByID.
  rpc CreateTransactionAsync(CreateTransactionRequest) returns (TransactionResponse);

  rpc GetHistory(GetHistoryRequest) returns (TransactionListResponse);
  rpc GetByID(GetByIDRequest) returns (TransactionResponse);
}

message CreateTransactionRequest {
  string user_id = 1;
  // Ключ идемпотентности клиента (заголовок Idempotency-Key). Повтор запроса с тем же
  // ключом не создаёт второй перевод, а возвращает результат первого.
  string idempotency_key = 2;
  string type = 3;            // "transfer" (комиссия 1%) или "payment" (комиссия 3%)
  string from_account_id = 4;
  string to_account_id = 5;
  int64 amount = 6;
}

message TransactionResponse {
  string id = 1;
  string type = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  int64 amount = 5;
  int32 fee_percent = 6;
  int64 fee_amount = 7;
  int64 total_debit = 8;
  string status = 9;          // pending | completed | failed
  string failure_reason = 10; // машиночитаемая причина отказа, если status = failed
  string created_at = 11;
  string updated_at = 12;
  bool idempotent_replay = 13; // ответ на повтор запроса с уже использованным ключом
}

message GetHistoryRequest {
  string user_id = 1;
  optional string account_id = 2; // фильтр по одному счёту пользователя
  int32 limit = 3;                 // по умолчанию 50, максимум 500
}

message GetByIDRequest {
  string user_id = 1;
  string transaction_id = 2;
}

message TransactionListResponse {
  repeated TransactionResponse transactions = 1;
  int32 total = 2;
}
